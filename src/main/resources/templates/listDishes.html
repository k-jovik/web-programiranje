<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>List Dishes</title>
    <style>
        table {
            width: 80%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
<h3>Listing all dishes: </h3>

<p>
    <a th:href="@{/dishes(sortBy='chef')}">
        <button type="button">Order Dishes by Chef</button>
    </a>
</p>
<hr/>

<table>
    <thead>
    <tr>
        <th>Dish ID</th>
        <th>Dish Name</th>
        <th>Cuisine</th>
        <th>Chef Name</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="dish : ${dishes}">
        <td th:text="${dish.dishId}">4</td>

        <td th:text="${dish.name}">Margherita Pizza</td>

        <td th:text="${dish.cuisine}">Italian</td>

        <td>
                <span th:if="${dish.chef != null}"
                      th:text="${dish.chef.firstName} + ' ' + ${dish.chef.lastName}">Jamie Oliver</span>
            <span th:unless="${dish.chef != null}" style="color: gray;">(Unassigned)</span>
        </td>

        <td>
            <a th:href="@{/dishes/edit/{id}(id=${dish.id})}">
                <button type="button">Editiraj</button>
            </a>
            <form th:method="POST" th:action="@{/dishes/delete/{id}(id=${dish.id})}" style="display: inline;">
                <button type="submit">Избриши</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
