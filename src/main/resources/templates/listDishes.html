<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>List Dishes</title>
    <style>
        table {
            width: 80%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
<h3>Listing all dishes: </h3>

<form action="/dishes" method="GET" style="margin-bottom: 20px;">
    <label for="chefSearchTerm">Search Dishes by Chef Name:</label>
    <input type="text"
           id="chefSearchTerm"
           name="chefSearchTerm"
           placeholder="Enter chef's name..."
           th:value="${chefSearchTerm}"> <button type="submit">🔍 Search</button>

    <a th:href="@{/dishes}" style="margin-left: 10px;">Clear Filter</a>
</form>

<form action="/dishes" method="GET" style="margin-bottom: 20px;">
    <label for="minPrepTime">Min Preparation Time (minutes):</label>
    <input type="number"
           id="minPrepTime"
           name="minPrepTime"
           placeholder="e.g. 15"
           th:value="${minPrepTime}">

    <button type="submit">Filter by Time</button>
</form>
<form action="/dishes" method="GET" style="margin-bottom: 20px;">
    <label for="cuisine">Filter By Cuisine</label>
    <input type="text"
    name="cuisine"
    id="cuisine"
    th:value="${cuisine}"
    >
    <button type="submit">Search</button>
</form>
<hr/>

<table>
    <thead>
    <tr>
        <th>Dish ID</th>
        <th>Dish Name</th>
        <th>Cuisine</th>
        <th>Chef Name</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="dish : ${dishes}">
        <td th:text="${dish.dishId}"></td>

        <td th:text="${dish.name}"></td>

        <td th:text="${dish.cuisine}"></td>

        <td>
                <span th:if="${dish.chef != null}"
                      th:text="${dish.chef.firstName} + ' ' + ${dish.chef.lastName}"></span>
            <span th:unless="${dish.chef != null}" style="color: gray;">(Unassigned)</span>
        </td>

        <td>
            <a th:href="@{/dishes/edit/{id}(id=${dish.id})}">
                <button type="button">Editiraj</button>
            </a>
            <form th:method="POST" th:action="@{/dishes/delete/{id}(id=${dish.id})}" style="display: inline;">
                <button type="submit">Избриши</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
